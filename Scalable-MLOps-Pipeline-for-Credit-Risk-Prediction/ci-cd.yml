name: CI-CD Pipeline

on:
  push:
    branches:
      - dev
      - staging
      - prod
  pull_request:
    branches:
      - dev

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # DVC needs the full git history to find the correct data versions
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Development Dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run Linter (e.g., flake8)
        # Add a linter like flake8 to your requirements-dev.txt
        run: |
          flake8 src/

      - name: Setup DVC
        uses: iterative/setup-dvc@v1

      - name: Authenticate DVC Remote Storage
        # This step is crucial. You must configure a DVC remote
        # (e.g., `dvc remote add -d myremote s3://my-bucket/dvcstore`)
        # and add credentials as GitHub secrets.
        # This example is for an S3 remote.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: dvc pull -r myremote

      - name: Reproduce DVC Pipeline
        run: dvc repro

      - name: Push DVC changes
        # Only push changes back to remote on merges to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: dvc push -r myremote

      - name: Run Unit Tests (Optional but Recommended)
        # If you have tests, run them here
        # run: pytest

  cd-staging:
    # This job only runs on a push to the staging branch, after CI succeeds
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code for Staging
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Staging Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/credit-risk-app:staging
            ${{ secrets.DOCKERHUB_USERNAME }}/credit-risk-app:${{ github.sha }}

      - name: Deploy to Staging Environment
        # Add your staging deployment script here (e.g., to a staging Heroku app)
        run: echo "Deploying to Staging..."

  cd-prod:
    # This job only runs on a push to the prod branch, after CI succeeds
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code for Production
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Production Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/credit-risk-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/credit-risk-app:prod
            ${{ secrets.DOCKERHUB_USERNAME }}/credit-risk-app:${{ github.sha }}

      - name: Deploy to Production Environment
        # Add your production deployment script here (e.g., to a production Heroku app)
        run: echo "Deploying to Production..."