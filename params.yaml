# params.yaml
train:
  model_type: logistic            # 'logistic' or 'random_forest'
  test_split_ratio: 0.2
  random_state: 42
  stratify: true
  label_col: default
  smote_random_state: 42
  decision_threshold: 0.68

features:
  categorical:
    - home_status
    - loan_intent
  numerical:
    - income
    - emp_years
    - loan_amount
    - loan_int_rate
    - loan_percent_income
    - credit_history

logistic:
  solver: liblinear
  penalty: l2
  C: 1
  max_iter: 1000
  class_weight: balanced

random_forest:
  n_estimators: 1000
  random_state: 42
